name: proton_denoise
description: >
  Audio denoising for Proton Meet (RNNoise; DeepFilter stub) on iOS, macOS,
  Android, Linux, and Windows.
version: 0.0.1
homepage: https://github.com/ProtonMeet

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.4.0
  livekit_client: ^2.7.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.proton.proton_denoise
        pluginClass: ProtonDenoisePlugin
      ios:
        pluginClass: ProtonDenoisePlugin
      linux:
        pluginClass: ProtonDenoisePlugin
      macos:
        pluginClass: ProtonDenoisePlugin
        # Implemented in Objective-C++ (ProtonDenoisePlugin.mm)
      windows:
        pluginClass: ProtonDenoisePluginCApi
