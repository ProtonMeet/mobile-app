name: proton_video_effects
description: >
  On-device camera video effects for Proton Meet — background blur today;
  custom virtual backgrounds on the roadmap.
version: 1.0.0
homepage: https://github.com/ProtonMeet

environment:
  sdk: ^3.11.5
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.4.0
  livekit_client: ^2.7.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: me.proton.meet.video_effects
        pluginClass: ProtonVideoEffectsPlugin
      ios:
        pluginClass: ProtonVideoEffectsPlugin
      macos:
        pluginClass: ProtonVideoEffectsPlugin
      linux:
        pluginClass: ProtonVideoEffectsPlugin
      windows:
        pluginClass: ProtonVideoEffectsPlugin
