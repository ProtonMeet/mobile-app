name: proton_video_effects
description: >
  On-device camera video effects for Proton Meet — background blur today;
  custom virtual backgrounds on the roadmap.
version: 1.0.0
homepage: https://github.com/ProtonMeet

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Version pins live in ../../pubspec.yaml; workspace lockfile resolves one copy.
  flutter_webrtc: any
  livekit_client: any
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: me.proton.meet.video_effects
        pluginClass: ProtonVideoEffectsPlugin
      ios:
        pluginClass: ProtonVideoEffectsPlugin
      macos:
        pluginClass: ProtonVideoEffectsPlugin
      linux:
        pluginClass: ProtonVideoEffectsPlugin
      windows:
        pluginClass: ProtonVideoEffectsPluginCApi
