// TODO: https://developer.android.com/build/migrate-to-kotlin-dsl#migrate-buildscript
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21")
        classpath("com.google.dagger:hilt-android-gradle-plugin:2.58")
        classpath("org.codehaus.groovy:groovy-json:3.0.19")
    }
}

allprojects {
    // Flutter projects (cryptography_flutter, ...) don't specify namespace using android { namespace ... }.
    // This fix make sure all projects specify it if null.
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
        }
    }
    
    // Force Kotlin version consistency across all projects
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:2.2.21"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.21"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.21"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:2.2.21"
        }
    }
}

// Flutter repo-root build/ (not android/build or android/app/build).
def repoRootBuildDir = rootProject.layout.projectDirectory.dir('../build')
rootProject.layout.buildDirectory.set(repoRootBuildDir)
// AGP CXX intermediates still consult legacy buildDir on some versions — keep both in sync.
rootProject.buildDir = repoRootBuildDir.asFile

subprojects { subproject ->
    def subBuildDir = repoRootBuildDir.dir(subproject.name)
    subproject.layout.buildDirectory.set(subBuildDir)
    subproject.buildDir = subBuildDir.asFile
    subproject.evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
