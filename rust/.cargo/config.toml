[build]
rustflags = ["--cfg", "mls_build_async"]

[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "mls_build_async", "--cfg", 'getrandom_backend="wasm_js"']

# `-C target-feature=-outline-atomics`: drop compiler-rt's aarch64 LSE
# outline-atomics runtime, whose `init_have_lse_atomics`/`__init_cpu_features`
# constructors call `getauxval` at `dlopen` load time and crash on Android 7/8
# (API 24-27). The remaining getauxval-based constructor (OpenSSL) is handled by
# the getauxval shim in crates/frb (getauxval_fix.c).
[target.aarch64-linux-android]
rustflags = ["--cfg", "mls_build_async", "-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "target-feature=-outline-atomics"]

[target.armv7-linux-androideabi]
rustflags = ["--cfg", "mls_build_async", "-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["--cfg", "mls_build_async", "-C", "link-arg=-Wl,-z,max-page-size=16384"]

# gopenpgp-sys (proton-crypto → meet-crypto) calls CFBundle*/CFString*; link CoreFoundation.
[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-framework", "-C", "link-arg=CoreFoundation"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-framework", "-C", "link-arg=CoreFoundation"]

[target.x86_64-apple-ios]
rustflags = ["-C", "link-arg=-framework", "-C", "link-arg=CoreFoundation"]

# Configure OpenSSL for Android cross-compilation
[env]
OPENSSL_STATIC = { value = "1", condition = { target-family = "android" } }
OPENSSL_VENDOR = { value = "1", condition = { target-family = "android" } }
